<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi Atlas de Viajes</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C0A11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Atlas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500;62..125,700;62..125,800&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Instrument+Sans:wght@400;500;600;700&family=Courier+Prime:wght@400;700&family=Mrs+Saint+Delafield&family=Noto+Color+Emoji&display=swap">
<style>
/* Concepto: un pasaporte. El globo es la tapa (piel vino + mapa en oro); el panel es una página de visados con sellos de tinta. */
:root{
  --cover:#4E1520; --cover-deep:#2C0A11; --cover-hi:#6B2230;
  --ocean:#2A0B12; --ocean-hi:#4A1621; --land:#5C1D29; --land-line:#9C7536;
  --gold:#E2BE68; --gold-hot:#F7E3A8; --gold-deep:#A87C2C; --foil-ink:#F7EBD0;
  --paper:#E8EDE6; --paper-hi:#F6F8F3; --ink:#1E2230; --muted:#596173; --faint:#8A90A0;
  --line:rgba(30,34,48,.14); --card:rgba(255,255,255,.62); --card-hi:#FFFFFF;
  --wine:#7A1E2C; --stamp-red:#B3263A; --stamp-blue:#1F4E9A; --stamp-green:#1F7A55; --stamp-violet:#5B3FA0;
  --danger:#B3263A; --ok:#1F7A55;
  --amber:var(--wine); --amber-hot:var(--wine); --amber-soft:rgba(122,30,44,.08);
  --f-display:Archivo, "Arial Narrow", system-ui, sans-serif;
  --f-serif:"Bodoni Moda", Didot, "Bodoni 72", "Times New Roman", serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Courier Prime", "Courier New", ui-monospace, monospace;
  --f-flag:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--cover-deep);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
.app{display:grid;grid-template-columns:1fr minmax(340px,420px);height:100%}
.stage{position:relative;overflow:hidden;background:radial-gradient(110% 90% at 35% 30%,var(--cover-hi) 0%,var(--cover) 45%,var(--cover-deep) 100%);color:var(--foil-ink)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{touch-action:none}
.cover-title{position:absolute;z-index:2;top:16px;left:calc(18px + env(safe-area-inset-left,0px));pointer-events:none;font-family:var(--f-display);font-stretch:75%;font-weight:700;letter-spacing:.32em;text-transform:uppercase;font-size:11px;color:var(--gold);opacity:.85;line-height:1.6}
.cover-title{display:flex;align-items:center;gap:10px;top:26px;left:calc(28px + env(safe-area-inset-left,0px))}
.cover-title .logo{width:40px;height:40px;flex:none;border-radius:9px;box-shadow:0 0 0 1px rgba(226,190,104,.35),0 6px 16px rgba(0,0,0,.4)}
.brand h1 .brand-logo{width:30px;height:30px;flex:none;align-self:center;border-radius:7px;box-shadow:0 2px 6px rgba(44,10,17,.25)}
.cover-title b{display:block;font-size:15px;letter-spacing:.24em;font-weight:800;background:linear-gradient(180deg,var(--gold-hot),var(--gold) 55%,var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent}
/* Página de visados */
.panel{position:relative;display:flex;flex-direction:column;min-height:0;background-color:var(--paper);
  background-image:
    repeating-radial-gradient(circle at 0% 0%,transparent 0 13px,rgba(31,122,85,.07) 13px 14px),
    repeating-radial-gradient(circle at 100% 100%,transparent 0 11px,rgba(122,30,44,.06) 11px 12px);
  box-shadow:inset 10px 0 18px -12px rgba(0,0,0,.35)}
.panel-head{padding-block:18px 12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:radial-gradient(circle,var(--cover-deep) 0 2.5px,transparent 3px) bottom left / 12px 6px repeat-x;padding-bottom:18px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1 .b1{font-family:var(--f-serif);font-style:italic;font-weight:700;font-size:28px;line-height:1;color:var(--wine);letter-spacing:-.01em}
.brand h1 .b2{font-family:var(--f-display);font-stretch:125%;font-weight:700;font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink)}
.brand .pageno{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;font-size:13px;color:var(--muted)}
.crumbs button{background:none;border:0;padding:2px 4px;border-radius:4px;color:var(--muted)}
.crumbs button:hover{color:var(--ink);background:var(--card)}
.crumbs .sep{opacity:.5}
.crumbs .here{color:var(--wine);font-family:var(--f-serif);font-style:italic;font-weight:700;font-size:14.5px;padding:2px 4px}
.view{flex:1;overflow-y:auto;padding-block:18px 32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--f-display);font-stretch:125%;font-weight:700;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--f-serif);font-weight:800;font-size:46px;line-height:.95;letter-spacing:-.015em;margin:6px 0 0;text-wrap:balance;font-variant-numeric:lining-nums}
h2 em{font-style:italic;font-weight:500;color:var(--wine)}
h3{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-stretch:125%;font-weight:700;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;margin:0;color:var(--ink)}
h3 i{font-family:var(--f-serif);font-style:italic;font-weight:500;font-size:14px;letter-spacing:0;text-transform:none;color:var(--muted)}
.section-head h3,.section > h3{flex:1}
.section > h3::after,.section-head h3::after{content:"";flex:1;align-self:center;border-top:1px solid rgba(30,34,48,.22);min-width:16px}
p{margin:0}
.muted{color:var(--muted)}
.flag{font-family:var(--f-flag);font-style:normal;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:12px}
.stat b{display:block;font-family:var(--f-serif);font-size:40px;font-weight:800;color:var(--wine);line-height:1;font-variant-numeric:lining-nums tabular-nums}
.stat small{display:block;margin-top:8px;color:var(--muted);font-family:var(--f-display);font-stretch:112%;font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;line-height:1.35}
.progress{display:flex;flex-direction:column;gap:8px}
.progress .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.progress .count{font-family:var(--f-serif);font-style:italic;font-size:30px;font-weight:800;color:var(--wine);font-variant-numeric:lining-nums tabular-nums}
.bar2{position:relative;margin-top:18px;height:16px;border-radius:3px;background:var(--paper-hi);box-shadow:inset 0 0 0 1px rgba(30,34,48,.22)}
.segs{position:absolute;inset:0;display:flex;gap:2px;border-radius:3px;overflow:hidden}
.seg{flex:none;width:0;height:100%;border:0;padding:0;background:var(--c);transition:width 1.1s cubic-bezier(.2,.8,.2,1),opacity .2s,filter .2s}
.progress.in .seg{width:var(--w)}
.progress.in .seg:nth-child(2){transition-delay:.15s}.progress.in .seg:nth-child(3){transition-delay:.3s}.progress.in .seg:nth-child(4){transition-delay:.45s}
.progress.focus .seg:not(.on){opacity:.25}
.seg.on{filter:saturate(1.3)}
.tick{position:absolute;top:-16px;bottom:-3px;width:0;border-left:1px dashed var(--faint);pointer-events:none}
.tick em{position:absolute;top:0;left:3px;font-style:normal;font-family:var(--f-mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
.tick.done{border-left-color:var(--wine)}.tick.done em{color:var(--wine)}
.tick.goal{border-left:0}.tick.goal em{left:auto;right:0}
.zoomed .bar2{background-image:linear-gradient(90deg,transparent calc(100% - 1px),rgba(30,34,48,.2) 0);background-size:calc(100% / var(--n)) 100%}
.zoom-toggle{display:inline-flex;align-self:flex-start;border:1px solid var(--line);background:var(--card);border-radius:4px;padding:2px;gap:2px}
.zoom-toggle button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:4px 10px;border-radius:3px}
.zoom-toggle button.on{background:var(--ink);color:var(--paper-hi)}
.prog-info{font-size:13px;color:var(--muted);min-height:2.6em}
.prog-info b{color:var(--ink)}
.chip.cont-chip{border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .2s,background .2s}
.cont-chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.cont-chip.on,.chip.cont-chip:hover{border-color:var(--c);background:var(--card-hi)}
.list{display:flex;flex-direction:column;gap:8px}
.list{gap:0!important;border-top:1px solid rgba(30,34,48,.28)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px dotted rgba(30,34,48,.35);border-radius:0;padding:13px 4px;transition:background .15s,padding .15s}
.item:hover{background:rgba(255,255,255,.55);padding-left:10px}
.item .flag{font-size:26px}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-family:var(--f-serif);font-weight:700;font-size:19px;line-height:1.15}
.item .txt small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .go{color:var(--faint);font-size:18px}
.item .num{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--wine);white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.fact{border-top:1px solid rgba(30,34,48,.25);padding-top:8px}
.fact span{display:block;font-family:var(--f-display);font-stretch:125%;font-weight:700;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.fact span i{display:block;font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--faint);margin-bottom:3px}
.fact b{font-family:var(--f-serif);font-weight:600;font-size:16px;line-height:1.25}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:3px;background:var(--wine);color:var(--paper-hi);font-weight:600}
.chip.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.note{position:relative;background:transparent;border:1px solid rgba(30,34,48,.28);border-radius:2px;padding:18px 16px 14px;display:flex;flex-direction:column;gap:8px}
.note > .eyebrow:first-child{position:absolute;top:-8px;left:12px;background:var(--paper);padding:0 6px;color:var(--stamp-green)}
.note p{font-family:var(--f-serif);font-size:16.5px;line-height:1.45}
.mono{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.musts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;counter-reset:m}
.musts li{display:flex;gap:12px;align-items:baseline;counter-increment:m;font-family:var(--f-serif);font-size:17px;padding-bottom:6px;border-bottom:1px dotted rgba(30,34,48,.25)}
.musts li::before{content:counter(m,decimal-leading-zero);flex:none;font-family:var(--f-mono);font-weight:700;font-size:12px;color:var(--wine)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:4px;padding:10px 16px;font-weight:700;background:var(--wine);color:var(--paper-hi)}
.btn:hover{background:#5E1521}
.btn.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(30,34,48,.3)}
.btn.sec:hover{background:var(--card-hi)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px rgba(179,38,58,.45)}
.btn.small{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:wait}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mem{background:var(--card-hi);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 0 rgba(30,34,48,.06)}
.mem-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mem-top b{font-family:var(--f-serif);font-style:italic;font-weight:700;font-size:20px;line-height:1.15}
.mem p{white-space:pre-wrap;font-family:var(--f-serif);font-size:16px;line-height:1.5}
.mem .where{font-size:12px;color:var(--wine)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.photos button{padding:0;border:4px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.18);border-radius:2px;overflow:hidden;aspect-ratio:1;background:var(--paper);max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.mem-actions{display:flex;gap:8px;justify-content:flex-end}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.empty{border:1px dashed rgba(30,34,48,.3);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;color:var(--muted)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pager button{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;text-align:left;min-width:0}
.pager button:last-child{text-align:right}
.pager small{display:block;color:var(--faint);font-size:11px;font-family:var(--f-mono);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.pager b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-serif);font-style:italic;font-weight:700;font-size:17px}
.ai{font-size:12px;color:var(--faint)}
/* Tarjeta de embarque con ruta de vuelo */
.view > *{flex-shrink:0}
.boarding{--notch:var(--paper);position:relative;background:var(--paper-hi);border:1px solid rgba(30,34,48,.2);border-radius:10px;box-shadow:0 1px 0 rgba(30,34,48,.06),0 8px 22px -14px rgba(30,34,48,.45);overflow:hidden}
.boarding::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:repeating-linear-gradient(90deg,var(--wine) 0 22px,var(--gold-deep) 22px 30px)}
.bp-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:end;padding:18px 16px 0}
.bp-head .r{text-align:right}
.bp-head > div:nth-child(2){text-align:center}
.bp-l{display:block;font-family:var(--f-display);font-stretch:125%;font-weight:700;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.bp-l i{display:block;font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:11px;letter-spacing:0;text-transform:none;color:var(--faint)}
.bp-v{display:block;font-family:var(--f-mono);font-weight:700;font-size:17px;color:var(--ink);letter-spacing:.04em;line-height:1.1;margin-top:2px}
.bp-v.big{font-family:var(--f-serif);font-style:italic;font-weight:800;font-size:34px;color:var(--wine);letter-spacing:-.01em;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.route{display:block;width:100%;height:auto;overflow:visible;margin:2px 0 0;padding:0 4px}
.route .future{fill:none;stroke:rgba(30,34,48,.35);stroke-width:1.4;stroke-dasharray:1.5 5;stroke-linecap:round}
.route .trail{fill:none;stroke:var(--wine);stroke-width:2.4;stroke-linecap:round}
.route .slot{fill:var(--paper-hi);stroke:rgba(30,34,48,.35);stroke-width:1.2}
.route .wp{cursor:pointer;outline:none}
.route .wp circle:not(.hit){stroke:var(--paper-hi);stroke-width:2;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.route .wp.in circle:not(.hit){transform:scale(1)}
.route .wp:hover circle:not(.hit),.route .wp:focus-visible circle:not(.hit),.route .wp.on circle:not(.hit){transform:scale(1.45)}
.route .wp .hit{fill:transparent}
.boarding.focus .wp:not(.on) circle:not(.hit){opacity:.25}
.route .mark line{stroke:var(--faint);stroke-width:1}
.route .mark text,.route .airport text{font-family:var(--f-mono);font-weight:700;font-size:9.5px;fill:var(--faint);text-anchor:middle;letter-spacing:.08em}
.route .mark.done line{stroke:var(--wine)}.route .mark.done text{fill:var(--wine)}
.route .airport circle{fill:var(--paper-hi);stroke:var(--ink);stroke-width:2}
.route .airport.dest circle{stroke:var(--gold-deep);stroke-dasharray:2 2}
.route .airport.dest text{fill:var(--gold-deep)}
.route .plane path{fill:var(--wine);stroke:var(--paper-hi);stroke-width:.8}
.boarding.landed .plane{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -2.5px}}
.bp-tear{position:relative;height:0;margin:8px 0 0;border-top:2px dashed rgba(30,34,48,.22)}
.bp-tear::before,.bp-tear::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--notch);border:1px solid rgba(30,34,48,.2)}
.bp-tear::before{left:-10px}.bp-tear::after{right:-10px}
.bp-foot{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.bp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bp-code{font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--muted);padding:3px 8px;border:1px solid rgba(30,34,48,.25);border-radius:3px}
.boarding .prog-info{min-height:2.6em;margin:0}
.fields dd .sub{display:block;margin-top:6px;font-family:var(--f-body);font-style:normal;font-weight:500;font-size:11.5px;line-height:1.35;color:var(--muted)}
.fields .editable{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.fields .editable .pen{font-family:var(--f-body);font-style:normal;font-weight:600;font-size:11px;color:var(--faint);margin-left:6px;text-decoration:underline;text-underline-offset:2px}
.fields .editable:hover .pen{color:var(--wine)}
.emblem .holder{font-family:var(--f-serif);font-style:italic;font-weight:700;font-size:13px;letter-spacing:0;text-transform:none;color:var(--ink);text-align:center;line-height:1.2}
/* Firma del titular */
.signature{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:transparent;border:0;padding:6px 0 0;color:inherit;font:inherit}
button.signature{cursor:pointer}
.sig-area{position:relative;display:block;container-type:inline-size;padding:6px 0 0;min-height:96px}
.sig{display:block;position:relative;z-index:1;font-family:"Mrs Saint Delafield","Brush Script MT",cursive;font-weight:400;font-size:min(60px,10.8cqi);line-height:1.25;color:#1D2F6B;white-space:nowrap;padding:14px 4px 0;transform:rotate(-3deg);transform-origin:left bottom;animation:write 2.6s cubic-bezier(.45,.05,.3,1) .4s both}
@keyframes write{from{clip-path:inset(-20% 100% -40% 0)}to{clip-path:inset(-20% -5% -40% 0)}}
.sig-stamp{position:absolute;right:-6px;top:34px;width:min(104px,24cqi);height:auto;transform:rotate(-14deg);mix-blend-mode:multiply;opacity:.78;fill:none;stroke:var(--wine);animation:thump .35s cubic-bezier(.3,1.6,.5,1) 2.9s both}
@keyframes thump{from{opacity:0;transform:rotate(-14deg) scale(1.5)}to{opacity:.78;transform:rotate(-14deg) scale(1)}}
.sig-stamp .o1{stroke-width:3}.sig-stamp .o2{stroke-width:1}
.sig-stamp text{fill:var(--wine);stroke:none;font-family:var(--f-mono);font-weight:700;text-anchor:middle}

<script>
(() => {
"use strict";
/* ---------- Constantes ---------- */
const CONTINENTS = {
  'europa':            { name:'Europa', view:[10,49,3.0] },
  'america-del-norte': { name:'América del Norte', note:'Incluye Centroamérica y el Caribe', view:[-82,24,2.0] },
  'america-del-sur':   { name:'América del Sur', view:[-60,-16,1.9] },
  'asia':              { name:'Asia', view:[92,32,1.7] },
  'africa':            { name:'África', view:[20,3,1.9] },
  'oceania':           { name:'Oceanía', view:[150,-22,2.0] },
  'antartida':         { name:'Antártida', view:[0,-82,1.8] },
};
const CONT_ORDER = Object.keys(CONTINENTS);
const PLACE_K = 34;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOPO = window.WORLD, INFO = window.COUNTRY_INFO;
const FEATURES = topojson.feature(TOPO, TOPO.objects.countries).features;
const FEAT = {}; FEATURES.forEach(f => FEAT[f.id] = f);
const BORDERS = topojson.mesh(TOPO, TOPO.objects.countries);
const GRAT = d3.geoGraticule10();

/* ---------- Estado ---------- */
const S = { countries:{}, places:{}, memories:{}, meta:{}, loaded:{countries:false,places:false,memories:false,meta:false}, status:'loading' };
let DB = null, ASSETS = null, canWrite = false, samplePromise = null;
let route = { level:'world', id:null };
const view = { lon:-25, lat:28, k:1 };
let flight = null, dirty = true, spinPausedUntil = 0, pick = null, hoverInfo = null;
let quiz = null;

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const flag = a2 => a2 && /^[A-Z]{2}$/.test(a2) ? String.fromCodePoint(...[...a2].map(c => 127397 + c.charCodeAt(0))) : '🏳️';
const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60) || 'lugar';
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const fmtMonth = ym => { if(!ym) return ''; const [y,m] = ym.split('-').map(Number); if(!y) return ''; if(!m) return String(y); return new Date(y, m-1, 1).toLocaleDateString('es', {month:'long', year:'numeric'}); };
const fmtDate = d => { if(!d) return ''; const t = new Date(d + (d.length === 10 ? 'T12:00:00' : '')); return isNaN(t) ? d : t.toLocaleDateString('es', {day:'numeric', month:'long', year:'numeric'}); };
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }

const countriesSorted = () => Object.entries(S.countries).map(([id,c]) => ({id, ...c}));
const placesOf = cid => Object.entries(S.places).filter(([,p]) => p.country === cid).map(([id,p]) => ({id,...p}))
  .sort((a,b) => (a.order ?? 1e9) - (b.order ?? 1e9) || (a.createdAt||'').localeCompare(b.createdAt||''));
const countriesOf = cont => countriesSorted().filter(c => c.continent === cont && placesOf(c.id).length)
  .sort((a,b) => Math.min(...placesOf(a.id).map(p=>p.order??1e9)) - Math.min(...placesOf(b.id).map(p=>p.order??1e9)) || a.name.localeCompare(b.name,'es'));
const visitedCountries = () => countriesSorted().filter(c => placesOf(c.id).length);
const visitedAtlas = () => new Set(visitedCountries().map(c => c.atlasId));
function allPlacesOrdered(){
  const out = [];
  for (const cont of CONT_ORDER) for (const c of countriesOf(cont)) out.push(...placesOf(c.id));
  return out;
}
const memoriesOf = pid => Object.entries(S.memories).filter(([,m]) => m.place === pid).map(([id,m]) => ({id,...m}))
  .sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.createdAt||'').localeCompare(a.createdAt||''));
const blobUrl = id => window.__blobUrl(id);

/* ---------- Canvas y proyección ---------- */
const stage = $('#stage'), cvG = $('#globe'), cvF = $('#fx'), cvS = $('#stars');
const ctx = cvG.getContext('2d'), fx = cvF.getContext('2d'), sx = cvS.getContext('2d');
let W = 0, H = 0, DPR = 1;
const proj = d3.geoOrthographic().clipAngle(90).precision(0.35);
const path = d3.geoPath(proj, ctx);
const R0 = () => Math.min(W, H) * 0.42;
function applyView(){ proj.rotate([-view.lon, -view.lat]).scale(R0() * view.k).translate([W/2, H/2]); }

function resize(){
  const r = stage.getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height); DPR = Math.min(2, devicePixelRatio || 1);
  for (const c of [cvG, cvF, cvS]) { c.width = W*DPR; c.height = H*DPR; }
  for (const c of [ctx, fx, sx]) c.setTransform(DPR,0,0,DPR,0,0);
  drawStars(); dirty = true;
}
function drawStars(){
  sx.clearRect(0,0,W,H);
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const n = Math.round(W*H/2600);
  for (let i=0;i<n*14;i++){ const a = rnd(); sx.fillStyle = a > .5 ? `rgba(255,220,200,${(a-.5)*0.07})` : `rgba(0,0,0,${a*0.16})`; sx.fillRect(rnd()*W, rnd()*H, 1.4, 1.4); }
  const m = 12; sx.strokeStyle = 'rgba(226,190,104,.32)'; sx.lineWidth = 1; sx.strokeRect(m+.5, m+.5, W-2*m-1, H-2*m-1); sx.strokeRect(m+4.5, m+4.5, W-2*m-9, H-2*m-9);
}

const css = getComputedStyle(document.documentElement);
const C = n => css.getPropertyValue(n).trim();
const COL = { ocean:C('--ocean'), oceanHi:C('--ocean-hi'), land:C('--land'), line:C('--land-line'), amber:C('--gold'), hot:C('--gold-hot'), deep:C('--gold-deep'), ink:C('--foil-ink') };
function foil(R){ const cx = W/2, cy = H/2; const g = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R); g.addColorStop(0, COL.hot); g.addColorStop(.45, COL.amber); g.addColorStop(.7, COL.deep); g.addColorStop(1, COL.amber); return g; }

function drawGlobe(){
  applyView();
  const R = proj.scale(), cx = W/2, cy = H/2;
  ctx.clearRect(0,0,W,H);
  // halo atmosférico
  if (R < Math.hypot(W,H)) {
    const g = ctx.createRadialGradient(cx,cy,R*0.96,cx,cy,R*1.22);
    g.addColorStop(0,'rgba(226,190,104,.22)'); g.addColorStop(.35,'rgba(226,190,104,.06)'); g.addColorStop(1,'rgba(226,190,104,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }
  // océano
  const og = ctx.createRadialGradient(cx - R*.35, cy - R*.4, R*.1, cx, cy, R*1.05);
  og.addColorStop(0, COL.oceanHi); og.addColorStop(1, COL.ocean);
  ctx.beginPath(); path({type:'Sphere'}); ctx.fillStyle = og; ctx.fill();
  // retícula
  ctx.beginPath(); path(GRAT); ctx.strokeStyle = 'rgba(226,190,104,.13)'; ctx.lineWidth = .6; ctx.stroke();
  const visited = visitedAtlas();
  // tierra no visitada
  ctx.beginPath(); for (const f of FEATURES) if (!visited.has(f.id)) path(f);
  ctx.fillStyle = COL.land; ctx.fill();
  // países visitados con brillo
  const sel = route.level === 'country' ? S.countries[route.id]?.atlasId : route.level === 'place' ? S.countries[S.places[route.id]?.country]?.atlasId : null;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 1.5; const FOIL = foil(R);
  const contOf = {}; if (hoverCont) for (const c of visitedCountries()) contOf[c.atlasId] = c.continent;
  for (const id of visited) {
    const f = FEAT[id]; if (!f) continue; ctx.beginPath(); path(f);
    if (hoverCont) { const on = contOf[id] === hoverCont; ctx.fillStyle = on ? COL.hot : FOIL; ctx.globalAlpha = on ? 1 : .25; }
    else { ctx.fillStyle = id === sel ? COL.hot : FOIL; ctx.globalAlpha = sel && id !== sel ? .7 : 1; }
    ctx.fill();
  }
  ctx.restore();
  // fronteras
  ctx.beginPath(); path(BORDERS); ctx.strokeStyle = COL.line; ctx.lineWidth = .6; ctx.stroke();
  if (hoverInfo?.atlasId && FEAT[hoverInfo.atlasId]) { ctx.beginPath(); path(FEAT[hoverInfo.atlasId]); ctx.strokeStyle = COL.hot; ctx.lineWidth = 1.6; ctx.stroke(); }
  // sombreado de volumen
  const sh = ctx.createRadialGradient(cx - R*.3, cy - R*.35, R*.2, cx, cy, R);
  sh.addColorStop(0,'rgba(255,230,200,.06)'); sh.addColorStop(.75,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(20,3,7,.5)');

    if (p >= 1) { flight = null; syncZoom(); }

  const endT = tAt(frac), [px, py] = routePt(endT);

    +   '<path d="' + d + '" class="trail" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:' + (reduceMotion ? 1 - frac : 1) + '"/>'
    +   marks + empties + stops
    +   '<g class="airport" transform="translate(' + RV.p0 + ')"><circle r="5"/><text y="22">ORIGEN</text></g>'
    +   '<g class="airport dest" transform="translate(' + RV.p2 + ')"><circle r="5"/><text y="22">' + max + ' %</text></g>'
    +   '<g class="plane" transform="' + planeAt + '"><path d="' + PLANE + '" transform="scale(1.25)"/></g>'
    + '</svg>'
    + '<div class="bp-tear" aria-hidden="true"></div>'
    + '<div class="bp-foot">'
    +   '<p class="prog-info" id="prog-info" aria-live="polite">' + progressDefault() + '</p>'
    +   '<div class="bp-row"><div class="zoom-toggle" role="group" aria-label="Destino del vuelo">'
    +     '<button data-act="prog-zoom" data-z="1" class="' + (progZoom ? 'on' : '') + '">Hasta el ' + next + ' %</button>'
    +     '<button data-act="prog-zoom" data-z="0" class="' + (progZoom ? '' : 'on') + '">Vuelta al mundo</button></div>'

function setHoverCont(id, countryId){

function animateProgress(fast){
  const prog = $('#prog'); if (!prog) return;
  const el = prog.querySelector('.count'), to = +el.dataset.to, frac = +prog.dataset.frac;
  const plane = prog.querySelector('.plane'), trail = prog.querySelector('.trail'), wps = [...prog.querySelectorAll('.wp')];
  if (reduceMotion) { wps.forEach(w => w.classList.add('in')); return; }
  const dur = fast ? 1000 : 2400, t0 = performance.now() + (fast ? 0 : 300);
  const step = t => {
    if (!prog.isConnected) return;
    const p = Math.max(0, Math.min(1, (t - t0) / dur)), e = d3.easeCubicInOut(p), f = frac * e;
    const rt = tAt(f), [x, y] = routePt(rt);
    plane.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ') rotate(' + routeAng(rt).toFixed(1) + ')');
    trail.style.strokeDashoffset = String(1 - f);
    el.textContent = pctTxt(to * e);
    for (const w of wps) if (+w.dataset.f <= f + 1e-6) w.classList.add('in');
    if (p < 1) requestAnimationFrame(step); else { wps.forEach(w => w.classList.add('in')); prog.classList.add('landed'); }
  };
  requestAnimationFrame(step);
}

function guessContinent(atlasId){
  const f = FEAT[atlasId]; if (!f) return 'europa';
  let poly = f; if (f.geometry.type === 'MultiPolygon') { let ba = -1; for (const c of f.geometry.coordinates) { const g = {type:'Polygon', coordinates:c}; const a = d3.geoArea(g); if (a > ba) { ba = a; poly = g; } } }
  const [lon, lat] = d3.geoCentroid(poly);
  if (lat < -60) return 'antartida';
  if (lon < -30 && lon > -170) return (lat > 12.6 || (lon < -77 && lat > 7)) ? 'america-del-norte' : 'america-del-sur';
  if (lon > -25 && lon < 45 && lat > 35) return 'europa';
  if (lon > -20 && lon < 52 && lat < 37) return (lon > 34 && lat > 12) ? 'asia' : 'africa';
  if ((lon > 140 && lat < 0) || (lon > 110 && lat < -10) || lon < -150) return 'oceania';
  return 'asia';
}

async function wikiSummary(title){
  try {
    const r = await fetch('https://es.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')));
    if (!r.ok) return '';
    const j = await r.json(); if (j.type === 'disambiguation' || !j.extract) return '';
    const s = j.extract.split(/(?<=[.!?])\s+/).slice(0, 2).join(' ');
    return s.length > 300 ? j.extract.split(/(?<=[.!?])\s+/)[0] : s;
  } catch { return ''; }
}

    if (j[0]) { out.lat = +j[0].lat; out.lon = +j[0].lon; }
  } catch {}
  const [dp, dc] = await Promise.all([wikiSummary(name), newCountry ? wikiSummary(cname) : '']);
  if (dp) out.datos.push(dp);
  if (newCountry && dc) out.pais = { dato: dc };
  return (isFinite(out.lat) || dp) ? out : null;
}
async function getSample(){
  if (!samplePromise) samplePromise = (window.claude?.use ? window.claude.use('sample').catch(() => null) : Promise.resolve(null));
  return samplePromise;
}

async function locatePlace(draft){
  pick = { ...draft, lat:null, lon:null, info:null, busy:true };
  const cname = INFO[draft.atlasId]?.[1] || '';
  const existing = countryByAtlas(draft.atlasId);
  const f = FEAT[draft.atlasId];
  if (f) { const c0 = d3.geoCentroid(f); flyTo(c0[0], c0[1], Math.min(8, view.k > 3 ? view.k : 4)); }
  renderBanner();
  const web = await lookupPlace(draft.name, cname, INFO[draft.atlasId]?.[0], !existing);
  if (web) { pick.info = web; if (isFinite(web.lat)) { pick.lat = +web.lat.toFixed(4); pick.lon = +web.lon.toFixed(4); flyTo(pick.lon, pick.lat, 24); } }
  if (false) {
    const prompt = `Eres el asistente de un atlas de viajes personal en español. Responde SOLO con JSON válido, sin texto extra.
Lugar: "${draft.name}" en ${cname}.
Devuelve:
{"lat": número (grados decimales), "lon": número, "nombre": "nombre correcto del lugar en español", "iata": "código IATA de 3 letras del aeropuerto comercial más útil para llegar, o \\"\\"", "datos": ["dos datos curiosos breves y verificables, una frase cada uno"], "imprescindibles": ["tres sitios que ver"], "pista": "frase corta para un juego de adivinar el lugar, sin decir su nombre ni el del país"${existing ? '' : `, "pais": {"capital": "...", "idioma": "...", "moneda": "...", "dato": "un dato curioso breve del país", "continente": uno de ${JSON.stringify(CONT_ORDER)}}`}}
Si no conoces bien el lugar, deja las listas vacías y da coordenadas aproximadas.`;
    try {
      const info = await sample.json(prompt, { modelTier:'default' });
      if (info && isFinite(info.lat) && isFinite(info.lon) && Math.abs(info.lat) <= 90 && Math.abs(info.lon) <= 180) {
        pick.info = info; pick.lat = +(+info.lat).toFixed(4); pick.lon = +(+info.lon).toFixed(4);
        flyTo(pick.lon, pick.lat, 24);
      }
    } catch (e) { /* sin datos: el usuario marca a mano */ }
  }
  if (!pick) return; // cancelado mientras tanto
  pick.busy = false; renderBanner();
}

function renderBanner(){
  const b = $('#banner');
  if (!pick) { b.hidden = true; b.innerHTML = ''; cvF.style.cursor = 'grab'; return; }
  b.hidden = false; cvF.style.cursor = 'crosshair';
  if (pick.busy) { b.innerHTML = `<p><span class="spinner"></span>Buscando ${esc(pick.name)} en el globo…</p><div class="row-btns"><button class="btn sec small" data-banner="manual">Marcar yo a mano</button><button class="btn sec small" data-banner="cancel">Cancelar</button></div>`; }
  else if (pick.lat == null) { b.innerHTML = `<p>Toca el globo donde está <b>${esc(pick.name)}</b>. Puedes girarlo y acercarte antes.</p><div class="row-btns"><button class="btn sec small" data-banner="cancel">Cancelar</button></div>`; }
  else b.innerHTML = `<p><b>${esc(pick.name)}</b> está aquí. Si el punto no es exacto, toca el globo para moverlo.</p><div class="row-btns"><button class="btn small" data-banner="save">Guardar lugar</button><button class="btn sec small" data-banner="cancel">Cancelar</button></div>`;
  b.querySelectorAll('[data-banner]').forEach(btn => btn.onclick = async () => {
    const k = btn.dataset.banner;
    if (k === 'cancel') { pick = null; renderBanner(); }
    else if (k === 'manual') { pick.busy = false; renderBanner(); }
    else if (k === 'save') { btn.disabled = true; btn.textContent = 'Guardando…'; try { await savePlace(); } catch (e) { toast('No se pudo guardar. Inténtalo de nuevo.'); btn.disabled = false; btn.textContent = 'Guardar lugar'; } }
  });
}

function uniqueId(base, taken){ let id = base, n = 2; while (taken(id)) id = `${base}-${n++}`; return id; }

async function savePlace(){
  const d = pick, info = d.info || {};
  const now = new Date().toISOString();
  let cid = countryByAtlas(d.atlasId);
  if (!cid) {
    const inf = INFO[d.atlasId] || ['', d.atlasId, 0];
    cid = uniqueId(slug(inf[1]), id => S.countries[id] || S.places[id] || CONTINENTS[id] || id === 'quiz');
    const pi = info.pais || {};
    const cont = CONT_ORDER.includes(pi.continente) && !d.continentTouched ? d.continent : d.continent;
    await DB.collection('countries').doc(cid).set({
      name: inf[1], atlasId: d.atlasId, a2: inf[0], continent: cont, un: !!inf[2],
      capital: String(pi.capital || ''), idioma: String(pi.idioma || ''), moneda: String(pi.moneda || ''), dato: String(pi.dato || ''),
      source: info.pais ? 'web' : 'manual', createdAt: now });
  }
  const pname = d.name;
  const pid = uniqueId(slug(pname), id => S.places[id] || S.countries[id] || CONTINENTS[id] || id === 'quiz' || (id === cid));
  const arr = (x, n) => Array.isArray(x) ? x.filter(s => typeof s === 'string' && s.trim()).slice(0, n).map(s => s.slice(0, 300)) : [];
  await DB.collection('places').doc(pid).set({
    name: pname, country: cid, lat: d.lat, lon: d.lon, visited: d.visited,
    iata: typeof info.iata === 'string' && /^[A-Z]{3}$/.test(info.iata) ? info.iata : '',
    facts: arr(info.datos, 3), musts: arr(info.imprescindibles, 4), clue: typeof info.pista === 'string' ? info.pista.slice(0, 200) : '',
    source: d.info ? 'web' : 'manual', order: Date.now(), createdAt: now });
  pick = null; renderBanner();
  S.pendingGo = pid; toast(`${pname} añadido a tu atlas`);
  if (S.places[pid]) { S.pendingGo = null; go(pid); }
}

/* ---------- Recuerdos ---------- */
async function shrink(file){
  try {
    const bmp = await createImageBitmap(file, { imageOrientation:'from-image' });
    const s = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    return blob || file;
  } catch { return file; }
}
async function deleteMemory(mid){
  const m = S.memories[mid];
  await DB.collection('memories').doc(mid).delete();
  if (ASSETS && m?.photos) for (const ph of m.photos) { try { await ASSETS.delete(ph); } catch {} }
}
function openMemory(pid, mid){
  const p = S.places[pid]; const m = mid ? S.memories[mid] : null;
  let photos = m?.photos ? [...m.photos] : [];
  const today = new Date().toISOString().slice(0,10);
  openSheet(`
    <h3>${m ? 'Editar recuerdo' : 'Nuevo recuerdo'} · ${esc(p.name)}</h3>
    <form id="fmem" class="section">
      <div class="field"><label for="mm-title">Título</label><input id="mm-title" maxlength="90" placeholder="Por ejemplo: Atardecer en el puerto" value="${esc(m?.title || '')}"></div>
      <div class="field"><label for="mm-date">Fecha</label><input id="mm-date" type="date" value="${esc(m?.date || (p.visited ? p.visited + '-01' : today))}"></div>
      <div class="field"><label for="mm-text">Qué recuerdas</label><textarea id="mm-text" maxlength="4000" placeholder="Con quién fuiste, qué comiste, qué te sorprendió…">${esc(m?.text || '')}</textarea></div>
      ${ASSETS ? `<div class="field"><label for="mm-files">Fotos</label><div class="photos" id="mm-cur"></div><input id="mm-files" type="file" accept="image/*" multiple><span class="hint">Se reducen a 1800 px para ocupar menos.</span></div>` : `<p class="hint">Solo quien puede editar esta página puede subir fotos.</p>`}
      <p class="err" id="mm-err" hidden></p>
      <div class="row-btns"><button class="btn" type="submit" id="mm-save">Guardar recuerdo</button><button class="btn sec" type="button" data-close>Cancelar</button></div>
      ${m ? `<div id="mm-del"><button class="btn danger small" type="button" data-del>Eliminar recuerdo…</button></div>` : ''}
    </form>`, o => {
      const cur = o.querySelector('#mm-cur');
      const drawCur = () => { if (cur) cur.innerHTML = photos.map((ph,i) => `<button type="button" data-rm="${i}" title="Quitar foto" style="position:relative"><img src="${esc(blobUrl(ph))}" alt=""><span style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);border-radius:50%;width:22px;height:22px;display:grid;place-items:center">×</span></button>`).join(''); };
      drawCur();
      cur?.addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b) { photos.splice(+b.dataset.rm, 1); drawCur(); } });
      o.querySelector('[data-close]').onclick = closeSheet;
      o.querySelector('#fmem').onsubmit = async ev => {
        ev.preventDefault();
        const btn = o.querySelector('#mm-save'), err = o.querySelector('#mm-err'); btn.disabled = true; err.hidden = true;
        try {
          const files = [...(o.querySelector('#mm-files')?.files || [])];
          for (let i = 0; i < files.length; i++) {
            btn.textContent = `Subiendo foto ${i+1} de ${files.length}…`;
            const r = await ASSETS.upload(await shrink(files[i])); photos.push(r.id);
          }
          btn.textContent = 'Guardando…';
          const removed = (m?.photos || []).filter(ph => !photos.includes(ph));
          const data = { place: pid, title: o.querySelector('#mm-title').value.trim(), date: o.querySelector('#mm-date').value, text: o.querySelector('#mm-text').value.trim(), photos };
          if (m) await DB.collection('memories').doc(mid).update(data);
          else await DB.collection('memories').add({ ...data, createdAt: new Date().toISOString() });
          for (const ph of removed) { try { await ASSETS.delete(ph); } catch {} }
          closeSheet(); toast('Recuerdo guardado');
        } catch (e) {
          err.hidden = false; err.textContent = e?.code === 'too_large' ? 'Una foto es demasiado grande.' : e?.code === 'quota_or_state' ? 'Se ha llenado el espacio para fotos.' : 'No se pudo guardar. Inténtalo de nuevo.';
          btn.disabled = false; btn.textContent = 'Guardar recuerdo';
        }
      };
      o.querySelector('[data-del]')?.addEventListener('click', () => {
        o.querySelector('#mm-del').innerHTML = `<div class="note"><p>El recuerdo y sus fotos se borrarán para siempre.</p><div class="row-btns"><button class="btn danger small" type="button" data-yes>Sí, eliminar</button><button class="btn sec small" type="button" data-no>No</button></div></div>`;
        o.querySelector('[data-no]').onclick = closeSheet;
        o.querySelector('[data-yes]').onclick = async e2 => { e2.target.disabled = true; try { await deleteMemory(mid); closeSheet(); toast('Recuerdo eliminado'); } catch { toast('No se pudo eliminar.'); e2.target.disabled = false; } };
      });
    });
}

/* ---------- Datos ---------- */
function onData(){
  if (Object.values(S.loaded).every(Boolean)) {
    if (S.status === 'loading') { S.status = 'ready'; route = parse(location.hash); render(); camera(); return; }
  }
  if (S.status !== 'ready') return;
  if (S.pendingGo && S.places[S.pendingGo]) { const id = S.pendingGo; S.pendingGo = null; go(id); return; }
  const r = parse(location.hash);
  if (r.level !== route.level || r.id !== route.id) { route = r; camera(); }
  if (!$('#overlay').hidden) return; // no tocar el panel mientras hay un formulario
  render();
}
function subscribe(name){
  DB.collection(name).onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { o[d.id] = d.data() || {}; }); S[name] = o; S.loaded[name] = true; onData();
  }, () => { if (S.status === 'loading') { S.status = 'error'; render(); } });
}
async function boot(){
  resize(); syncZoom(); render(); requestAnimationFrame(frame);
  new ResizeObserver(() => resize()).observe(stage);
  const use = window.claude?.use;
  if (!use) { setTimeout(() => { if (S.status === 'loading' && !window.claude?.use) { S.status = 'offline'; render(); } }, 1500); return; }
  const timer = setTimeout(() => { if (S.status === 'loading') { S.status = 'error'; render(); } }, 10000);
  DB = await window.claude.use('db').catch(() => null);
  if (!DB) { clearTimeout(timer); S.status = 'offline'; render(); return; }
  const user = await window.claude.use('user').catch(() => null);
  const can = user?.can ? await Promise.resolve(user.can('data.write')).catch(() => null) : null;
  canWrite = can !== false;
  window.claude.use('assets').then(a => { ASSETS = a; }).catch(() => {});
  for (const n of ['countries','places','memories','meta']) subscribe(n);
  const iv = setInterval(() => { if (S.status !== 'loading') { clearTimeout(timer); clearInterval(iv); } }, 300);
}
// Carga de prueba fuera de claude.ai (solo para revisar el diseño en local)
window.__atlasLocal = (seed) => { S.countries = seed.countries; S.places = seed.places; S.memories = seed.memories || {}; S.meta = seed.meta || {}; S.status = 'ready'; route = parse(location.hash); render(); camera(); };
boot();
})();
